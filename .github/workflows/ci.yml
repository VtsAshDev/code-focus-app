name: CI Quality Gatekeeper

on:
  push:
  pull_request:

jobs:
  validate:
    name: Lint & Verify Integrity
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run Linter (ESLint)
        run: npx eslint .

      - name: 🩺 Run Expo Doctor (Integrity Check)
        run: npx expo-doctor
